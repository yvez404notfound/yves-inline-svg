name: CI
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Fail Build w vulnerabilities
        run: npm audit --audit-level=high

      - name: Lint / typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
